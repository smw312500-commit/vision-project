[project]
name = "vision-project"
version = "1.0.0"
description = "AI 영상 감지 시스템 포트폴리오"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-security[common,fsqla]>=5.7.1",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "lap>=0.5.12",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "ultralytics>=8.3.235",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "ruff>=0.4.0",
]
